#### Debian 13 preseed for the ThinkCentre Tiny firewall (bench install)
# Loaded by the "Firewall install" boot menu entry.
# Asks only three things: the fwadmin password (twice) and the final
# "Write the changes to disks?" confirmation before erasing the NVMe drive.

### Safety guard: refuse to run on anything that is not a ThinkCentre Tiny
d-i preseed/early_command string \
  if ! grep -qiE '@@HW_MODEL_REGEX@@' @@HW_MODEL_FILE@@; then \
    debconf-set partman-auto/disk /dev/refused-not-a-thinkcentre-tiny; \
    exit 1; \
  fi

### Locale and keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network: first interface with link, DHCP (bench install behind the ASUS)
d-i netcfg/choose_interface select auto
d-i netcfg/link_wait_timeout string 15
d-i netcfg/get_hostname string firewall
d-i netcfg/get_domain string lan
d-i netcfg/hostname string firewall
d-i hw-detect/load_firmware boolean true

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Accounts: no root login, one admin user. Password is typed at the console.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Firewall Admin
d-i passwd/username string fwadmin

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string @@TIME_ZONE@@
d-i clock-setup/ntp boolean true

### Partitioning: whole NVMe drive, one root partition plus swap.
# partman/confirm is deliberately NOT preseeded: the installer stops and asks
# before it writes anything.
d-i partman-auto/disk string @@INSTALL_DISK@@
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true

### Apt
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates, backports
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true

### Packages (Suricata 8 is installed from trixie-backports by setup.sh)
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string nftables dnsmasq unbound rsyslog chrony git etckeeper \
  unattended-upgrades apt-listchanges needrestart sudo curl ca-certificates jq \
  ethtool tcpdump conntrack iperf3 intel-microcode lm-sensors smartmontools nvme-cli \
  suricata-update python3 bubblewrap socat
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/update-policy select unattended-upgrades
popularity-contest popularity-contest/participate boolean false
iperf3 iperf3/start_daemon boolean false

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default
d-i grub-installer/force-efi-extra-removable boolean true

### Firewall bootstrap: copy files from the USB and configure the system
d-i preseed/late_command string sh /cdrom/firewall/late.sh

### Finish
d-i finish-install/reboot_in_progress note
