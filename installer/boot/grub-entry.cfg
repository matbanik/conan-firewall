menuentry --hotkey=f 'Firewall automated install (ERASES NVMe drive)' {
    set background_color=black
    linux    /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/firewall/preseed.cfg locale=en_US.UTF-8 keymap=us hostname=firewall domain=lan vga=788 --- quiet
    initrd   /install.amd/initrd.gz
}
