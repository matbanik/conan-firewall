# dhcpcd for wan0 only (the provider's side). The inside interfaces are static.
allowinterfaces wan0
ipv4only
noipv6rs

# Client ID 01:<MAC>, as the ASUS udhcpc sent. With the cloned MAC, the provider sees the same client.
clientid
persistent
# No hostname and no vendor class to the ISP (the ASUS sent neither).
option domain_name_servers, domain_name, classless_static_routes, interface_mtu
require dhcp_server_identifier

# Keep the box's own resolv.conf (127.0.0.1), hostname and time sources.
nohook resolv.conf, hostname, timesyncd.conf
