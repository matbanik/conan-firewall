# Production DHCP range (ASUS: LAN pool .20-.254, 86400 s). The ASUS guest VLAN 52 is retired.
dhcp-range=set:lan,@@LAN_PREFIX@@.20,@@LAN_PREFIX@@.254,255.255.255.0,24h

# Local names. "local" makes dnsmasq answer these domains itself and never forward them.
domain=lan,@@LAN_PREFIX@@.0/24,local

host-record=firewall,firewall.lan,@@LAN_PREFIX@@.1
host-record=switch,switch.lan,@@LAN_PREFIX@@.3
host-record=ap,ap.lan,@@LAN_PREFIX@@.4
