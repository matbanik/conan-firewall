# Bench DHCP ranges. trunk0 is cabled only to a test client, never to the house switch:
# a second DHCP server on the house LAN would hand out wrong gateways.
dhcp-range=set:lan,192.168.12.20,192.168.12.254,255.255.255.0,4h

domain=lan,192.168.12.0/24,local

host-record=firewall,firewall.lan,192.168.12.1
