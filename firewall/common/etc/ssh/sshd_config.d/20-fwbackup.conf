# The backup user for tools/pull-fw-backup.ps1 on @@ADMIN_HOST@@. The installer's 10-firewall.conf allows only fwadmin.
# sshd adds AllowUsers lines from all files together, so this line adds fwbackup and keeps fwadmin.
# The fwbackup key in authorized_keys has restrict, from= (@@ADMIN_HOST@@ only) and a forced command.
AllowUsers fwbackup
