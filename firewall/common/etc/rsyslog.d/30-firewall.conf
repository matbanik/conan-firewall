# Syslog for the firewall. Nothing is forwarded: fw-ingest loads these logs into the database on the box
# (/var/lib/fwdb/fwlog.duckdb). @@LOG_HOST@@ was the collector until 2026-11-24.

# nftables log lines (DROP_*, ACCEPT GEO) go to their own file and not to kern.log or syslog.
if $syslogfacility-text == 'kern' and re_match($msg, '(DROP(_[A-Z]+)?|ACCEPT [A-Z]+) IN=') then {
	action(type="omfile" file="/var/log/firewall.log")
	stop
}
