# One unbound line per name that the DNS blocklists stop. They go to /var/log/dnsbl.log, and fw-ingest
# counts them per device and name. They stay out of /var/log/syslog, because they are many.
if $programname == 'unbound' and $msg contains 'rpz: applied' then {
	action(type="omfile" file="/var/log/dnsbl.log")
	stop
}
