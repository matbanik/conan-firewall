# Suricata alerts (fast.log, one line each) go into syslog with tag suricata-alert, so other rules can use
# them. They stay out of /var/log/syslog, because fast.log already has them.
module(load="imfile")
input(type="imfile" File="/var/log/suricata/fast.log" Tag="suricata-alert" Severity="warning"
      Facility="local5" freshStartTail="on")
if $programname == 'suricata-alert' then stop
