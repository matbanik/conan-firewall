# Syslog from the access point and the switch (UDP 514, only their two addresses pass nftables) goes to its own file.
# It has its own ruleset, so it is not mixed with the firewall's log and is not forwarded. fw-ingest loads the file.
# The time is the time of receipt, because the switch's clock is wrong, and the host is the sender's address.
module(load="imudp")
template(name="lan-device" type="string" string="%timegenerated:::date-rfc3339% %fromhost-ip% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")
# The switch sends no standard header, so its whole line is kept.
template(name="lan-switch" type="string" string="%timegenerated:::date-rfc3339% %fromhost-ip% switch: %rawmsg-after-pri:::drop-last-lf%\n")
ruleset(name="lan-devices") {
	if $fromhost-ip == '@@LAN_PREFIX@@.3' then {
		action(type="omfile" file="/var/log/lan-devices.log" template="lan-switch" fileOwner="root" fileGroup="adm" fileCreateMode="0640")
	} else {
		action(type="omfile" file="/var/log/lan-devices.log" template="lan-device" fileOwner="root" fileGroup="adm" fileCreateMode="0640")
	}
}
input(type="imudp" port="514" ruleset="lan-devices")
