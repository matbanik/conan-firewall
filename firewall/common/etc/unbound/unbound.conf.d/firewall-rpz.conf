# DNS blocklists (RPZ). The first zone that matches a name decides. fw-dnsbl writes the list zones
# (settings in /etc/default/fw-dnsbl); each blocked name gets one line in /var/log/dnsbl.log
# and is answered as an alias of blocked.internal, whose address is 0.0.0.0. Not NXDOMAIN and not an empty answer: after
# those, Android asks again for "name.lan".

server:
	# Not in the signed root zone, so the validator must not look for it there.
	domain-insecure: "blocked.internal"

auth-zone:
	name: "blocked.internal"
	zonefile: /etc/unbound/blocked.zone
	for-downstream: no
	for-upstream: yes
	fallback-enabled: no

# 1. Allowlist: names here are never blocked. Edit rpz-allow.zone in the repo, then deploy.
rpz:
	name: rpz.allow
	zonefile: /etc/unbound/rpz-allow.zone

# 2. Hagezi Multi PRO: ads, trackers, telemetry, phishing, malware.
rpz:
	name: rpz.hagezi-pro
	zonefile: /var/lib/unbound/rpz/hagezi-pro.rpz
	rpz-action-override: cname
	rpz-cname-override: "blocked.internal"
	rpz-log: yes
	rpz-log-name: hagezi-pro

# 3. Hagezi Threat Intelligence Feeds (medium): malware, phishing, C2. Quad9 also blocks malware upstream.
rpz:
	name: rpz.hagezi-tif
	zonefile: /var/lib/unbound/rpz/hagezi-tif.rpz
	rpz-action-override: cname
	rpz-cname-override: "blocked.internal"
	rpz-log: yes
	rpz-log-name: hagezi-tif
