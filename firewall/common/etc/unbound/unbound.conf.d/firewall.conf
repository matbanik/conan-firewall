# unbound: validating resolver for dnsmasq only. Forwards over TLS to Quad9 (the ASUS sent plain DNS to 8.8.8.8).
# Debian's own files in this directory already set the root trust anchor and unbound-control.
server:
	interface: 127.0.0.1@5335
	access-control: 127.0.0.0/8 allow
	do-ip4: yes
	do-ip6: no
	do-udp: yes
	do-tcp: yes
	num-threads: 2
	so-reuseport: yes
	msg-cache-size: 64m
	rrset-cache-size: 128m
	prefetch: yes
	# RFC 8767: answer from an expired cache entry if Quad9 is slow or down, then refresh it.
	serve-expired: yes
	serve-expired-ttl: 86400
	serve-expired-client-timeout: 1800
	qname-minimisation: yes
	harden-glue: yes
	harden-dnssec-stripped: yes
	hide-identity: yes
	hide-version: yes
	edns-buffer-size: 1232
	tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt
	# Second rebind guard behind dnsmasq's stop-dns-rebind.
	private-address: 10.0.0.0/8
	private-address: 172.16.0.0/12
	private-address: 192.168.0.0/16
	private-address: 169.254.0.0/16
	private-domain: "plex.direct"
	verbosity: 1
	# respip is needed for the RPZ blocklists in firewall-rpz.conf.
	module-config: "respip validator iterator"
	# Firefox turns off its own DNS over HTTPS when this name does not exist, so it uses the blocklists here.
	local-zone: "use-application-dns.net." always_nxdomain

forward-zone:
	name: "."
	forward-tls-upstream: yes
	forward-addr: 9.9.9.9@853#dns.quad9.net
	forward-addr: 149.112.112.112@853#dns.quad9.net
