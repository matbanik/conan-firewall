#!/usr/sbin/nft -f
# Router ruleset for the M920q firewall. Replaces the old router's iptables (see MAPPING.md).
# Addresses and interface names come from profile.nft (prod or bench). Apply only with fw-apply or deploy.sh.
#
# Log prefixes match what rsyslog and fw-ingest parse: \bDROP(_[A-Z]+)?\b and \bACCEPT\b, plus SRC=/DST=/DPT=.
# Keep one segment after DROP_ (DROP_WAN, not DROP_WAN_SSH): that regex does not match a second underscore.
# rsyslog writes these lines to /var/log/firewall.log and fw-ingest loads them into the database.
# "ACCEPT GEO" lines are log-only country matches (GEO_ACTION=log in /etc/default/fw-blocklists).

flush ruleset

include "/etc/nftables.d/profile.nft"

table inet fw {
	# Scanner noise on WAN that is dropped without a log line.
	set wan_noise_tcp {
		type inet_service
		elements = { 23, 445, 1433, 3389, 5900, 7680, 8080, 55592 }
	}

	# IP blocklists. Empty here; fw-blocklists fills them (sources in /etc/default/fw-blocklists), and
	# fw-blocklists-load.service loads the cached copy again after every nftables start or reload.
	set bl_v4 {
		type ipv4_addr
		flags interval
		auto-merge
		comment "Spamhaus DROP, Feodo C2, ET compromised, DShield top attackers"
	}
	set geo_drop_v4 {
		type ipv4_addr
		flags interval
		auto-merge
		comment "countries in GEO_COUNTRIES when GEO_ACTION=drop"
	}
	set geo_log_v4 {
		type ipv4_addr
		flags interval
		auto-merge
		comment "countries in GEO_COUNTRIES when GEO_ACTION=log"
	}

	# Blocklisted WAN sources are dropped before conntrack: no state entry and no log line.
	# Replies to a LAN connection toward a listed address also stop here.
	chain pre_bl {
		type filter hook prerouting priority raw; policy accept;
		iifname != $WAN_IF return
		ip saddr $RUSTDESK_REMOTE return comment "never block the RustDesk remote"
		ip saddr @bl_v4 counter drop
		ip saddr @geo_drop_v4 counter drop
	}

	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid counter drop
		iif "lo" accept
		meta nfproto ipv6 counter drop comment "IPv6 is off, as on the ASUS (ipv6_service=disabled)"

		iifname $MGMT_IF jump in_mgmt
		iifname $LAN_IF jump in_lan
		iifname $WAN_IF jump in_wan
		limit rate 5/second burst 20 packets log prefix "DROP_IN " level info
		counter drop
	}

	# Rescue port: always SSH, never anything that could break it.
	chain in_mgmt {
		tcp dport 22 accept
		udp dport 67 accept comment "one DHCP address for a rescue laptop"
		icmp type echo-request accept
		counter drop
	}

	chain in_lan {
		tcp dport 22 accept comment "SSH, key login for fwadmin only"
		udp dport { 53, 67, 123 } accept comment "DNS, DHCP, NTP"
		tcp dport 53 accept
		ip saddr { @@LAN_PREFIX@@.3, @@LAN_PREFIX@@.4 } udp dport 514 accept comment "syslog from the switch and the access point"
		icmp type echo-request limit rate 20/second accept
		fib daddr type { broadcast, multicast } counter drop comment "NetBIOS, SSDP, mDNS chatter"
		limit rate 5/second burst 20 packets log prefix "DROP_LAN " level info
		counter drop
	}

	chain in_wan {
		udp sport 67 udp dport 68 accept comment "DHCP lease from the provider"
		ip saddr @wan_ssh_allow tcp dport 22 accept comment "bench profile only; empty in prod"
		icmp type echo-request counter drop comment "no WAN ping, as on the ASUS (INPUT_PING)"
		tcp dport @wan_noise_tcp counter drop
		limit rate 5/second burst 20 packets log prefix "DROP_WAN " level info
		counter drop
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		tcp flags syn tcp option maxseg size set rt mtu comment "MSS clamp, as on the ASUS"
		ct state established,related accept
		ct state invalid counter drop
		meta nfproto ipv6 counter drop
		ct status dnat accept comment "RustDesk forwards; the source limit is in nat prerouting"

		# New LAN connections to a listed address: a LAN host may be infected, so these are logged.
		# The RustDesk remote is never blocked, in either direction (pre_bl exempts its replies).
		iifname $LAN_IF ip daddr != $RUSTDESK_REMOTE ip daddr @bl_v4 limit rate 10/minute burst 10 packets log prefix "DROP_BLOUT " level info
		iifname $LAN_IF ip daddr != $RUSTDESK_REMOTE ip daddr @bl_v4 counter drop
		iifname $LAN_IF ip daddr != $RUSTDESK_REMOTE ip daddr @geo_drop_v4 limit rate 10/minute burst 10 packets log prefix "DROP_GEO " level info
		iifname $LAN_IF ip daddr != $RUSTDESK_REMOTE ip daddr @geo_drop_v4 counter drop
		iifname $LAN_IF ip daddr @geo_log_v4 limit rate 10/minute burst 10 packets log prefix "ACCEPT GEO " level info
		# DNS over TLS from the LAN bypasses the DNS blocklists. A reset makes Android and others fall back to port 53.
		iifname $LAN_IF oifname $WAN_IF tcp dport 853 limit rate 10/minute burst 10 packets log prefix "DROP_DOT " level info
		iifname $LAN_IF oifname $WAN_IF tcp dport 853 counter reject with tcp reset

		iifname $LAN_IF oifname $WAN_IF accept comment "LAN to internet"
		limit rate 5/second burst 20 packets log prefix "DROP_FWD " level info
		counter drop
	}
}

table ip nat {
	chain prerouting {
		type nat hook prerouting priority dstnat; policy accept;
		# RustDesk, source-restricted, same as vts_rulelist on the ASUS. Never add a forward without ip saddr.
		iifname $WAN_IF ip saddr $RUSTDESK_REMOTE tcp dport { 21115, 21116, 21117 } dnat to $RUSTDESK_HOST
		iifname $WAN_IF ip saddr $RUSTDESK_REMOTE udp dport 21116 dnat to $RUSTDESK_HOST
		# Hairpin: LAN clients using the public name for the relay (ASUS rule "RustDesk-hairpin").
		iifname $LAN_IF ip saddr $LAN_NET ip daddr != $FW_ADDRS fib daddr type local tcp dport 21117 dnat to $RUSTDESK_HOST
		# Force DNS: anything on port 53 that is not addressed to the firewall goes to dnsmasq anyway.
		iifname $LAN_IF fib daddr type != local meta l4proto { tcp, udp } th dport 53 redirect to :53
	}

	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		oifname $WAN_IF masquerade
		oifname $LAN_IF ip saddr $LAN_NET ip daddr $RUSTDESK_HOST ct status dnat masquerade comment "hairpin replies"
	}
}
