# dnsmasq: DHCP and the LAN-facing DNS cache. Upstream is unbound on 127.0.0.1#5335 (DNS over TLS to Quad9).
# Ranges, domains and host names are in 10-profile.conf; DHCP reservations are in 20-reservations.conf.

# Listen only on the inside interfaces (lo is added automatically). Never on wan0.
interface=trunk0
interface=mgmt0
bind-dynamic
no-dhcp-interface=lo

# Upstream
no-resolv
server=127.0.0.1#5335
domain-needed
bogus-priv
cache-size=10000

# Rebind protection (the ASUS had dns_norebind=0). Plex uses *.plex.direct names that resolve to LAN addresses.
stop-dns-rebind
rebind-localhost-ok
rebind-domain-ok=/plex.direct/

# /etc/hosts maps "firewall" to 127.0.1.1, which must not be handed to clients. Names come from host-record instead.
no-hosts

# DHCP
dhcp-authoritative
dhcp-option=option:ntp-server,0.0.0.0
# Rescue port: one address, no default route, so a laptop on mgmt0 keeps its own internet path.
dhcp-range=set:mgmt,10.255.255.2,10.255.255.2,255.255.255.252,1h
dhcp-option=tag:mgmt,option:router

# Logs: queries and DHCP to a file (rotated by /etc/logrotate.d/firewall), not to syslog.
log-facility=/var/log/dnsmasq.log
log-queries=extra
log-dhcp
