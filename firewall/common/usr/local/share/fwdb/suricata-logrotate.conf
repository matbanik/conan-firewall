# Used by fw-suricata-rotate.service. Today and yesterday stay readable as text for fw-ingest and for a closer look.
/var/log/suricata/eve.json
{
	daily
	rotate 14
	dateext
	compress
	delaycompress
	missingok
	notifempty
	create 0644 root root
	postrotate
		/usr/bin/systemctl kill --kill-whom=main --signal=HUP suricata.service 2>/dev/null || true
	endscript
}
